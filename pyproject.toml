[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "veille"
dynamic = ["version"]
description = "Veille scientifique en didactique des mathematiques : moissonnage de revues, liens PDF, export BibTeX"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["httpx>=0.27", "beautifulsoup4>=4.12"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
veille = "veille.run:main"

[tool.setuptools]
packages = ["veille", "veille.connectors"]

[tool.setuptools.dynamic]
version = {attr = "veille.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
